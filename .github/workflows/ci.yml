name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建脚本不许屏蔽 lint 规则
        # 2026-11-24：上一版 PR 为了让 CI 变绿，直接在三个 build.gradle.kts 里
        # `disable += "LocalContextGetResourceValueCall"`。规则被关掉之后，lint 就再也
        # 拦不住同一类问题。要修就修代码，不要把检查器关了。
        run: |
          if grep -rn "disable +=" --include=build.gradle.kts .; then
            echo "::error::构建脚本里出现 lint 屏蔽，请修代码而不是关规则"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 别让它按默认装 "tools"：这个包在新版 SDK 仓库里已经不存在，
          # 第一次跑 CI 就是在这一步挂的（Failed to find package 'tools'）。
          packages: platform-tools

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble + unit tests + lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lint

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tinychat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
