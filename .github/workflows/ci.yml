name: CI

on:
  push:
    branches: [master, main]
  # 2026-11-26：PR 也要跑。原来只写了 `pull_request:`，等于「任何 PR、任何事件都跑」，
  # 看不出边界；显式指名目标分支之后，改坏别人的 PR 在合并前就能看到红灯，
  # 而不是等合进 master 才发现。草稿 PR 打上「可评审」时会再跑一次（ready_for_review）。
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

# 同一个 ref 的旧运行直接取消：连续推几版时不用等前面几条慢慢跑完。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建脚本不许屏蔽 lint 规则
        # 2026-11-24：上一版 PR 为了让 CI 变绿，直接在三个 build.gradle.kts 里
        # `disable += "LocalContextGetResourceValueCall"`。规则被关掉之后，lint 就再也
        # 拦不住同一类问题。要修就修代码，不要把检查器关了。
        run: |
          if grep -rn "disable +=" --include=build.gradle.kts .; then
            echo "::error::构建脚本里出现 lint 屏蔽，请修代码而不是关规则"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 别让它按默认装 "tools"：这个包在新版 SDK 仓库里已经不存在，
          # 第一次跑 CI 就是在这一步挂的（Failed to find package 'tools'）。
          packages: platform-tools

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # 2026-11-26：Robolectric 的 `android-all` jar **不走 Gradle 缓存**，它自己用
      # MavenArtifactFetcher 往 `~/.m2` 下（一百多兆）。发 1.1.1 那天下午两次红灯都是它：
      # 一次是插件仓库解析不到 Kotlin 插件，一次是 `MavenArtifactFetcher` 里的
      # `HttpURLConnection` 抛 IOException，六个 Robolectric 用例整组报 classMethod FAILED。
      # 缓存之后同一把 key 直接命中，不再每次去 Maven Central 现下。
      # key 跟着 `libs.versions.toml` 走：升 Robolectric 版本就换一份新缓存，不会拿旧 jar 凑合。
      - name: Cache Robolectric 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Assemble + unit tests + lint
        run: |
          # 外网依赖偶发失败时重试一次：真错了第二遍照样挂（红得诚实），
          # 只是网络抖一下就过的，不会浪费一轮排查。
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lint || {
            echo "::warning::第一次构建失败，重跑一次"
            ./gradlew --no-daemon assembleDebug testDebugUnitTest lint
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tinychat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
